# Postgres for local development and tests (see README, «Локальный запуск»).
#
#   docker compose up -d
#   docker compose down -v   # also removes the data

services:
  db:
    image: postgres:16-alpine
    container_name: autodev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: autodev
      POSTGRES_PASSWORD: autodev
      POSTGRES_DB: autodev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autodev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
