# Seeds the projects table on first start. After that, edit projects in the
# dashboard (Settings → Projects); existing rows are not overwritten.
# ${VAR} is expanded from the environment.

projects:
  - slug: alerter
    name: Great Alerter
    base_branch: stage
    prod_branch: main
    stage_url: https://staging.alerter.zinchenkomig.com
    smoke_paths: ["/"]
    repos:
      # Monorepo: great_alerter_backend/ + great_alerter_frontend/. A full-stack
      # task is one PR; without version_url, "on stage" = the stage deploy
      # workflows succeeded for the merge commit.
      - name: zinchenkomig/great_alerter
        role: app
        # Regenerate the frontend's typed API client from the backend code in
        # the same checkout so Claude starts from a consistent contract.
        setup: |
          set -e
          (cd great_alerter_frontend && npm install --silent)
          ./scripts/gen-api.sh
