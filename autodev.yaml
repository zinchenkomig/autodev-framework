# Seeds the projects table on first start. After that, edit projects in the
# dashboard (Settings → Projects); existing rows are not overwritten.
# ${VAR} is expanded from the environment.

projects:
  - slug: alerter
    name: Great Alerter
    base_branch: stage
    prod_branch: main
    stage_url: https://staging.alerter.zinchenkomig.com
    smoke_paths: ["/"]
    repos:
      - name: zinchenkomig/great_alerter_backend
        role: backend
        # Without version_url, "on stage" = the stage deploy workflow succeeded
        # for the merge commit. Add e.g. https://staging.alerter.../api/version
        # once the app exposes its GIT_SHA.

      - name: zinchenkomig/great_alerter_frontend
        role: frontend
        # Regenerate the typed API client from the backend's OpenAPI schema so
        # Claude works against the current backend contract.
        setup: |
          set -e
          be=$(mktemp -d)
          git clone -q --depth 1 -b stage https://github.com/zinchenkomig/great_alerter_backend.git "$be"
          mkdir -p openapi
          (cd "$be" && unset VIRTUAL_ENV && uv sync -q --frozen &&
            POSTGRES__HOST=localhost POSTGRES__PORT=5432 POSTGRES__USER=x POSTGRES__PASSWORD=x POSTGRES__DB=x \
            uv run python -c "import json; from src.backend.main import app; json.dump(app.openapi(), open('$AUTODEV_WORKDIR/openapi/openapi.json', 'w'), indent=2)")
          rm -rf "$be"
          npm install --silent
          npm run gen:api
