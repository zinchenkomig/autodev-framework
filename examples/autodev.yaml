# AutoDev — example configuration. Copy to autodev.yaml and adjust.
# Seeds the projects table on first start; edit projects in the dashboard later.

projects:
  - slug: shop                      # used in URLs and task routing
    name: My Shop
    base_branch: stage              # tasks branch from and merge into this
    prod_branch: main               # "Release" merges stage → this
    stage_url: https://stage.shop.example.com
    smoke_paths: ["/", "/catalog"]  # pages QA opens on stage
    max_parallel: 1                 # concurrent tasks for this project
    # model: opus                   # override AUTODEV_MODEL for this project
    instructions: |
      Extra rules for this project that are not in CLAUDE.md.
    repos:                          # exactly one: keep several apps in a monorepo
      - name: acme/shop
        # Returns the deployed commit SHA, as JSON ({"sha": "..."}) or plain text.
        version_url: https://stage.shop.example.com/api/version
        setup: |                    # runs in the fresh checkout before Claude
          (cd web && npm ci)
